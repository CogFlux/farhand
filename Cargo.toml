[workspace]
resolver = "2"
members = ["crates/farhand-core", "crates/farhand"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/CogFlux/farhand"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
schemars = "1"
rmcp = { version = "3.4", features = ["server", "transport-io", "macros"] }
openssh = { version = "0.11", features = ["native-mux"] }
openssh-sftp-client = { version = "0.15", features = ["openssh"] }
toml = "0.9"
toml_edit = "0.25"
dirs = "6"
chrono = { version = "0.4", features = ["serde"] }
bytes = "1"
base64 = "0.22"
regex = "1"
globset = "0.4"
walkdir = "2"
